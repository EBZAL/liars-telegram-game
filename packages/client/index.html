<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Liar's Deck</title>
    <!-- Telegram WebApp SDK Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preload" as="image" href="/bg-lobby.webp" type="image/webp" />
    <link rel="preload" as="image" href="/bg-table.webp" type="image/webp" />
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body class="theme-dark">
    <audio id="bgm-audio" src="/bgm.mp3" loop autoplay playsinline preload="auto" style="display:none;"></audio>
    <audio id="shot-audio" src="/shot.wav" preload="auto" style="display:none;"></audio>
    <audio id="liar-audio" src="/liar.mp3" preload="auto" style="display:none;"></audio>
    <script>
      (function() {
        var audio = document.getElementById('bgm-audio');
        if (!audio) return;
        audio.volume = 0.35;

        function attemptPlay() {
          if (audio && audio.paused) {
            var promise = audio.play();
            if (promise && promise.catch) {
              promise.catch(function() {});
            }
          }
        }

        // Try playing immediately on load
        attemptPlay();
        window.addEventListener('load', attemptPlay);
        document.addEventListener('DOMContentLoaded', attemptPlay);

        // Telegram WebApp ready trigger
        if (window.Telegram && window.Telegram.WebApp) {
          try {
            window.Telegram.WebApp.ready();
            attemptPlay();
          } catch(e) {}
        }

        // Capture ANY user touch/click anywhere on the screen to unblock audio
        var events = ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'click'];
        function onFirstUserGesture() {
          attemptPlay();
          events.forEach(function(evt) {
            window.removeEventListener(evt, onFirstUserGesture, true);
            document.removeEventListener(evt, onFirstUserGesture, true);
          });
        }
        events.forEach(function(evt) {
          window.addEventListener(evt, onFirstUserGesture, true);
          document.addEventListener(evt, onFirstUserGesture, true);
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
