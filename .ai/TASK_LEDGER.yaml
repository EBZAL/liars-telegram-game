status_definitions:
  NOT_STARTED: Task exists but is not approved for execution.
  READY: Architect approved the task; repository writer persisted it for execution.
  IN_PROGRESS: Executor has started the task; a task-start state commit should make this durable when push is authorized.
  IMPLEMENTED: Executor completed implementation, committed evidence metadata, and awaits Architect verification.
  VERIFIED: Architect verified acceptance criteria/evidence and Gravity persisted that decision.
  BLOCKED: 'Architect-approved durable state: task cannot proceed due to an unresolved blocker.'
  FAILED: 'Architect-approved durable state: task verification/implementation is invalid and requires a new decision.'
  CANCELLED: Task intentionally abandoned.
  ARCHITECTURE_CHANGE_REQUIRED: Task cannot proceed without an approved architecture change.

